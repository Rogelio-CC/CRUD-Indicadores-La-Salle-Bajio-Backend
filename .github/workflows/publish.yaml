# Nombre del flujo de trabajo que aparecerá en la pestaña "Actions" de GitHub.
name: CI - Build & Publish Docker image

# Define el disparador (trigger) del workflow.
on:
  push:
    branches: [ main ] # Se ejecuta automáticamente cuando haces un 'push' a la rama main.

jobs:
  # Primer trabajo: Construir la imagen y subirla a Docker Hub.
  build-and-push:
    runs-on: ubuntu-latest # Usa una máquina virtual con la última versión de Ubuntu.
    steps:
      # 1. Descarga el código fuente de tu repositorio en la máquina virtual.
      - uses: actions/checkout@v4

      # 2. Configura Docker Buildx, que permite construir imágenes para distintas arquitecturas.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Inicia sesión en tu cuenta de Docker Hub usando secretos guardados en GitHub.
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 4. Construye la imagen a partir de tu Dockerfile y la sube al repositorio.
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .               # Usa la raíz del proyecto como contexto.
          file: ./Dockerfile      # Ruta del archivo de instrucciones de Docker.
          push: true               # Indica que debe subir la imagen tras construirla.
          tags: "${{ secrets.DOCKERHUB_REPO }}:${{ secrets.IMAGE_TAG }}" # Etiqueta la imagen con el nombre del repo y la versión.

